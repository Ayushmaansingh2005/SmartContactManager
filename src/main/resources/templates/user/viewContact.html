<!DOCTYPE html>
<html lang="en" th:replace="~{base :: parent(~{::#content},~{::title},~{::script})}">
<head>
    <title >All your Contacts</title>
    
</head>
<body>

  <div id="content">
        <!-- if user is logged in then show the side bar else not show side bar -->
        <div th:if="${loggedinUser}">
            <div data-th-replace="~{user/sidebar::sidebar}"></div>
        </div>
     <div  class="p-8 mt-10 sm:pl-54" style="height: 1000px">    
        <h1 class="text-5xl mb-2"> All your Contacts </h1>
        <p>List of Contacts that is related to you. </p>

        <div class="contacts_container mt-4 ">


             <div class="flex md:flex-row flex-col justify-between">
                         <form data-th-object="${contactSearchForm}" action=" " data-th-action="@{'/user/contacts/search'}">
                            <div class="flex items-center space-x-3 justify-start flex-column flex-wrap md:flex-row space-y-4 md:space-y-0 p-4">
                        
                                <div>
                                    
                                
                                    <select
                                      data-th-field="*{field}"
                                      id="underline_select" class="block py-2.5 ps-0 w-full text-sm text-body bg-white dark:bg-gray-700 border-0 border-b-2 border-default-medium appearance-none focus:outline-none focus:ring-0 focus:border-brand peer">
                                        <option selected value="">Select Field</option>
                                        <option value="name">Name</option>
                                        <option value="phone">Phone</option>
                                        <option value="email">Email</option>
                                        
                                    </select>
                        

                                </div>
                                <div class="search_input_container">
                                    <label for="input-group-1" class="sr-only">Search</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                                            <svg class="w-4 h-4 text-body" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg>
                                        </div>
                                        <input data-th-field="*{value}"  type="text" id="input-group-1" class="block w-full max-w-96 ps-9 pe-3 py-2 bg-white dark:bg-gray-700 border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand shadow-xs placeholder:text-body" placeholder="Search">
                                    </div>
                                </div>
                                <button type="submit" class="px-3 rounded py-2 bg-gray-800 text-white">Search</button>
                            </div>
                        </form>

                       <div class="mt-3  px-4"> <button type="button" onclick="exportData()" class="px-3  rounded py-2 bg-green-800 text-white">Export</button></div>

                    </div>
                

                <div class="relative overflow-x-auto bg-neutral-primary-soft shadow-xs rounded-base border-3 border-green-600 dark:border-green-500">

                    <div data-th-replace="~{message::messagebox}"></div>

                   
                    <table id="contact_table"
                    data-th-if="${pageContacts.totalElements>0}"
                    class="w-full text-sm text-left rtl:text-right text-body">
                        <thead class="text-sm text-body bg-neutral-secondary-medium border-b border-t border-default-medium">
                            <tr>
                               
                                <th scope="col" class="px-6 py-3 font-medium">
                                    Name
                                </th>
                                <th scope="col" class="px-6 py-3 font-medium">
                                    Phone
                                </th>
                                <th scope="col" class="px-6 py-3 font-medium">
                                    Links
                                </th>
                                <th scope="col" class="px-6 py-3 font-medium">
                                    Action
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr
                             data-th-object="${c}"
                             data-th-each="c:${pageContacts.getContent()}"
                             class="bg-white border-b border-gray-300 dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600">
                                
                                <th scope="row" class="flex items-center px-6 py-4 text-heading whitespace-nowrap">

                                    data-th-src="*{picture}"
                                    class="w-10 h-10 rounded-full" src="/docs/images/people/profile-picture-1.jpg" alt="Jese image">
                                    <div class="ps-3">
                                        <div 
                                            data-th-text="*{name}"
                                            class="text-base font-semibold">Neil Sims
                                        </div>
                                        <div
                                            data-th-text="*{email}" 
                                            class="font-normal text-body">neil.sims@flowbite.com
                                        </div>
                                    </div>  
                                </th>
                                <td class="px-6 py-4">
                                   <i class="fa-solid fa-phone w-4 h-4"></i>
                                    <span data-th-text="*{phoneNumber}"></span>
                                
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex items-center">
                                            <div data-th-if="*{favourite}" >
                                               <i class="fa-solid fa-star text-orange-500 "></i>
                                            </div> 
                                         <a class="pl-2" data-th-href="@{*{linkedInLink}}" target="_blank"><i class="fa-brands fa-linkedin-in"></i></a>
                                         <a class="p-2" data-th-href="@{*{websiteLink}}" target="_blank"><i class="fa-brands fa-facebook"></i></i></a>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                   <div>
                                        <!-- <a data-th-href="@{'/user/contacts/delete/' + *{id}}" class="p-1">
                                            <i class="fa-solid w-6 h-6 fa-trash"></i>
                                        </a> -->

                                         <button th:onclick="deleteContact([[${c.id}]])" class="p-1">
                                            <i class="fa-solid w-6 h-6 fa-trash"></i>
                                         </button>


                                        <a data-th-href="@{'/user/contacts/view/' + *{id}}" class="p-1">
                                            <i class="fa-solid fa-pen "></i>
                                        </a>
                                        <button 
                                        th:onclick="loadContactdata([[${c.id}]])" class="p-1">
                                            <i class="fa-solid fa-eye"></i>
                                        </button>

                                   </div>
                                </td>
                            </tr>
                                                 
                        </tbody>
                    </table>
                    <!-- pagination component -->
                    <div 
                    data-th-if="${pageContacts.totalElements>0}"
                    class="pagination_container bg-white  dark:bg-gray-800 p-4 flex justify-center">

                       <nav aria-label="Page navigation example">
                            <ul class="flex -space-x-px text-sm">
                                <li data-th-unless="${pageContacts.first}">
                                <a 
                                    data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+${pageContacts.number-1}}"
                                    href="#" class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-s-base text-sm w-10 h-10 focus:outline-none">
                                    <span class="sr-only">Previous</span>
                                    <svg class="w-4 h-4 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/></svg>
                                </a>
                                </li>
                                <li  data-th-each="index : ${#numbers.sequence(0,pageContacts.totalPages-1)}"
                                     data-th-classappend="${index==pageContacts.number?'bg-blue-100 dark:bg-gray-500': 'bg-white dark:bg-gray-800'}"
                                >
                                    <a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+${index}}" class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium text-sm w-10 h-10 focus:outline-none">

                                            <span data-th-text="${index+1}"></span>
                                    </a>
                                </li>
                                
                                <li data-th-unless="${pageContacts.last}">
                                    <a data-th-href="@{'/user/contacts?size='+${pageSize}+'&page='+${pageContacts.number+1}}" class="flex items-center justify-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading font-medium rounded-e-base text-sm w-10 h-10 focus:outline-none">
                                        <span class="sr-only">Next</span>
                                        <svg class="w-4 h-4 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7"/></svg>
                                    </a>
                                </li>
                            </ul>
                        </nav> 

                    </div>
                      <h1 class="text-5xl text-center bg-white dark:bg-gray-800 p-4"
                        data-th-if="${pageContacts.totalElements<=0}">No Result Found</h1>
                </div>

        </div>

       
     </div>
      <div data-th-replace="~{user/ContactModal :: contact}"></div>
  </div>  
    <script src="https://cdn.jsdelivr.net/npm/@linways/table-to-excel@1.0.4/dist/tableToExcel.min.js"></script>
    <script data-th-src="@{'/js/contact_modal.js'}"></script>
    <script>
       function exportData(){
            TableToExcel.convert(document.getElementById("contact_table"), {
                    name: "contacts.xlsx",
                    sheet: {
                        name: "Sheet 1"
                    }
            });
       }
    </script>
</body>
</html>
