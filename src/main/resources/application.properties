spring.application.name=scm2.0

# ? IMPORTANT
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# ? Base URL should NOT default to localhost in prod
server.baseURL=${BASE_URL:http://scm002.ap-south-1.elasticbeanstalk.com}

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:scm}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Vinit@123}

spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

spring.profiles.active=${ACTIVE_PROFILE:dev}
